syntax = "proto3";
package raftkv;
option java_package = "raftkv.rpc.proto";
option java_multiple_files = true;

service RaftService {
  rpc RequestVote (VoteRequest) returns (VoteResponse);
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
}

service KVService {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc GetState (StateRequest) returns (StateResponse);
}

message VoteRequest {
  int64 term = 1;
  int32 candidateId = 2;
  int64 lastLogIndex = 3;
  int64 lastLogTerm = 4;
}

message VoteResponse {
  int64 term = 1;
  bool voteGranted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int32 leaderId = 2;
  int64 prevLogIndex = 3;
  int64 prevLogTerm = 4;
  repeated LogEntryProto entries = 5;
  int64 leaderCommit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 matchIndex = 3; // helps leader update nextIndex faster on conflict
}

message LogEntryProto {
  int64 term = 1;
  int64 index = 2;
  string command = 3; // e.g. "PUT key value"
}

message PutRequest { string key = 1; string value = 2; }
message PutResponse { bool success = 1; int32 leaderId = 2; }
message GetRequest { string key = 1; }
message GetResponse { bool success = 1; string value = 2; int32 leaderId = 3; }

message StateRequest {}

message StateResponse {
  int32 node_id = 1;
  string role = 2;
  int64 current_term = 3;
  int32 leader_id = 4;
  int64 commit_index = 5;
  int64 last_applied = 6;
  map<string, string> database = 7;
  repeated LogEntryProto log_entries = 8;
  bool is_offline = 9;
}

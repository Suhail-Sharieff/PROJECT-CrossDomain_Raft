version: '3.8'

services:
  # --- DOMAIN A (VIRGINIA) ---
  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node-1
    ports:
      - "8001:8001"
      - "9001:9001"
    environment:
      - NODE_ID=1
      - NODE_PORT=8001
      - PEERS=2=node-2:8001,3=node-3:8001,4=node-4:8001,5=node-5:8001,6=node-6:8001
      - ELECTION_TIMEOUT_MIN_MS=150
      - ELECTION_TIMEOUT_MAX_MS=280
      - HEARTBEAT_INTERVAL_MS=50
      - DATA_DIR=/app/data
    volumes:
      - node-1-data:/app/data

  node-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node-2

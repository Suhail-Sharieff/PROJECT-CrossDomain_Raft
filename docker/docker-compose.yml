version: '3.8'

services:
  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node-1
    ports:
      - "8001:8001"
      - "9001:9001"
    environment:
      - NODE_ID=1
      - NODE_PORT=8001
      - PEERS=2=node-2:8001,3=node-3:8001
      - ELECTION_TIMEOUT_MIN_MS=300
      - ELECTION_TIMEOUT_MAX_MS=600
      - HEARTBEAT_INTERVAL_MS=50
      - DATA_DIR=/app/data
    volumes:
      - node-1-data:/app/data

  node-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node-2
    ports:
      - "8002:8001"
      - "9002:9001"
    environment:
      - NODE_ID=2
      - NODE_PORT=8001
      - PEERS=1=node-1:8001,3=node-3:8001
      - ELECTION_TIMEOUT_MIN_MS=300
      - ELECTION_TIMEOUT_MAX_MS=600
      - HEARTBEAT_INTERVAL_MS=50
      - DATA_DIR=/app/data
    volumes:
      - node-2-data:/app/data

  node-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8003:8001"
      - "9003:9001"
    container_name: node-3
    environment:
      - NODE_ID=3
      - NODE_PORT=8001
      - PEERS=1=node-1:8001,2=node-2:8001
      - ELECTION_TIMEOUT_MIN_MS=300
      - ELECTION_TIMEOUT_MAX_MS=600
      - HEARTBEAT_INTERVAL_MS=50
      - DATA_DIR=/app/data
    volumes:
      - node-3-data:/app/data

volumes:
  node-1-data:
  node-2-data:
  node-3-data:

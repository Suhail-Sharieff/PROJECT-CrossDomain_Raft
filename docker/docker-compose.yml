      - NODE_PORT=8001
      - PEERS=1=node-1:8001,3=node-3:8001,4=node-4:8001,5=node-5:8001,6=node-6:8001
      - ELECTION_TIMEOUT_MIN_MS=400
      - ELECTION_TIMEOUT_MAX_MS=750
      - HEARTBEAT_INTERVAL_MS=50
      - DATA_DIR=/app/data
    volumes:
      - node-2-data:/app/data

  node-3:
